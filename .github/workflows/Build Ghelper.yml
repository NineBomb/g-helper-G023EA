name: Build G-Helper

on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]
  workflow_dispatch:        # 允许手动触发

jobs:
  build:
    runs-on: windows-latest   # Windows runner，自带 .NET SDK

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore app/GHelper.csproj

      - name: Publish single-file self-contained exe
        run: |
         dotnet publish app/GHelper.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=embedded `
            -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GHelper-${{ github.sha }}
          path: publish/GHelper.exe
          if-no-files-found: error
          retention-days: 14
